<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Cliente - CRM com Presença</title>
  <link rel="stylesheet" href="CSS/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
  <header>
    <nav>
      <ul class="menu">
        <li><i class="bi bi-house"></i> <a href="index.html">Home</a></li>
        <li><i class="bi bi-plus-square"></i> <a href="cadastrar-cliente.html">Cadastrar Cliente</a></li>
        <li><i class="bi bi-list-ul"></i> <a href="lista_clientes.html">Lista de Clientes</a></li>
        <li><i class="bi bi-chat-dots"></i> <a href="presenca-em-cada-resposta.html">Presença em Cada Resposta</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Cadastrar Novo Cliente</h1>
    <p>Formulário demonstrativo para registro inicial de clientes e organização das informações de atendimento.</p>

    <form>
      <div class="form-group">
        <label for="nome"><i class="bi bi-person"></i> Nome completo</label>
        <input type="text" id="nome" name="nome" placeholder="Ex: Carla Souza">
      </div>

      <div class="form-group">
        <label for="email"><i class="bi bi-envelope"></i> E-mail</label>
        <input type="email" id="email" name="email" placeholder="cliente@email.com">
      </div>

      <div class="form-group">
        <label for="telefone"><i class="bi bi-telephone"></i> Telefone</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(81) 99999-9999">
      </div>

      <div class="form-group">
        <label for="empresa"><i class="bi bi-building"></i> Empresa</label>
        <input type="text" id="empresa" name="empresa" placeholder="Empresa ou organização">
      </div>

      <div class="form-group" style="grid-column: span 2;">
        <label for="motivo"><i class="bi bi-question-circle"></i> Motivo do contato</label>
        <select id="motivo" name="motivo">
          <option value="">Selecione</option>
          <option value="orcamento">Orçamento</option>
          <option value="duvida">Dúvida</option>
          <option value="reclamacao">Reclamação</option>
          <option value="acompanhamento">Acompanhamento</option>
        </select>
      </div>

      <div class="form-group" style="grid-column: span 2;">
        <label for="obs"><i class="bi bi-pencil-square"></i> Observações</label>
        <textarea id="obs" name="obs" placeholder="Registre informações importantes do atendimento."></textarea>
      </div>

      <button type="submit"><i class="bi bi-person-check-fill"></i> Cadastrar Cliente</button>
    </form>
  </main>

  <footer>
    <p>© 2026 Fernando Canto — Projeto de Portfólio</p>
    <p>Versão demonstrativa com dados fictícios.</p>
  </footer>
</body>
</html>
